<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>لا يوجد اتصال | كرم الشام</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 32px;
        text-align: center;
        background: #ffffff;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      }
      .badge {
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: rgba(228, 56, 32, 0.1);
        font-size: 44px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
      }
      p {
        margin: 0;
        max-width: 300px;
        font-size: 14px;
        line-height: 1.7;
        color: #7a7a7a;
      }
      button {
        margin-top: 8px;
        padding: 14px 32px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #e43820, #e85a00);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="badge">🍽️</div>
    <h1>تعذر الاتصال بالانترنت</h1>
    <p>تأكد من اتصالك بالانترنت ثم حاول مرة أخرى لعرض قائمة كرم الشام.</p>
    <button type="button" onclick="location.reload()">اعادة المحاولة</button>
  </body>
</html>
